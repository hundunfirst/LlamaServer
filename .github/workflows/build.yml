# CI：构建双引擎 + APK，产出引擎清单（格式预留：未来"引擎包在线更新"直接消费）
# 引擎入包布局（与 BinaryInstaller 一致）：app/src/main/assets/engines/{cpu,opencl}/
# engine-manifest.json 字段约定：
#   { "version": "<llama.cpp commit>", "abi": "arm64-v8a",
#     "artifact": "engine-arm64-<commit>.zip", "sha256": "...",
#     "min_app_version": "0.3.0", "built_at": "<iso8601>" }

name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  engine-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          # 注意：ninja 不是 Android SDK 仓库里的包（repository2-3.xml 无任何 ninja 条目），
          # 写进 packages 会让 sdkmanager "Failed to find package" 秒挂，故只装 ndk/cmake
          packages: 'ndk;27.3.13750724 cmake;3.22.1'

      - name: Ensure ninja
        # ubuntu runner 自带 ninja 则跳过，否则 apt 补装（后续 -G Ninja 需要）
        run: command -v ninja >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build)

      - name: Build OpenCL ICD loader (link-time stub)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-deps/OpenCL-Headers
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git opencl-deps/OpenCL-ICD-Loader
          cmake -S opencl-deps/OpenCL-ICD-Loader -B opencl-deps/icd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DOPENCL_ICD_LOADER_HEADERS_DIR=$PWD/opencl-deps/OpenCL-Headers \
            -DCMAKE_INSTALL_PREFIX=$PWD/opencl-deps/icd-install
          cmake --build opencl-deps/icd-build
          # --install 要的是构建目录（含 cmake_install.cmake），不是 CMAKE_INSTALL_PREFIX
          cmake --install opencl-deps/icd-build

      - name: Checkout pinned llama.cpp (v0.8.0)
        run: |
          # 必须锁版本：以前直接 clone master，CI 打出来的引擎和本地/发行版永远不是同一个。
          # v0.8.0 = 8642541b2，与 docs/ENVIRONMENT.md 保持一致（升级时两处一起改）。
          PIN=8642541b255bfb5dc39cd351a178be09013a55d6
          git init -q llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          # v0.8.0 是 annotated tag，按 tag 名取再 checkout，避免 FETCH_HEAD 指到 tag 对象
          git -C llama.cpp fetch --depth 1 origin tag v0.8.0
          git -C llama.cpp checkout -q v0.8.0
          # 校验 tag 没被移动：拿到别的提交就说明上游动了 tag，宁可红在这一步
          test "$(git -C llama.cpp rev-parse HEAD)" = "$PIN" \
            || { echo "::error::v0.8.0 tag 指向了 $PIN 以外的提交"; exit 1; }
          git -C llama.cpp --no-pager log -1 --format='引擎基线: %h %s'

      - name: Apply project engine patches (lazy experts)
        run: |
          # 这两个补丁给 App 的「MoE 按需读」用：ServerProcessManager 只有在引擎带补丁时
          # 才设 LLAMA_LAZY_TENSORS / LLAMA_LAZY_PREFETCH。不打也能跑，但会退化成保守路径，
          # CI 产物就与本地行为不一致了。
          for p in scripts/patches/0001-lazy-expert-tensors.patch \
                   scripts/patches/0002-moe-expert-prefetch.patch; do
            echo "applying $p"
            git -C llama.cpp apply --verbose "$GITHUB_WORKSPACE/$p"
          done
          git -C llama.cpp --no-pager diff --stat

      - name: Build engines (cpu + opencl, 16KB aligned)
        env:
          PYTHONUTF8: "1"
        run: |
          ALIGN="-Wl,-z,max-page-size=16384"
          COMMON="-DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DLLAMA_OPENSSL=OFF \
            -DGGML_CPU_KLEIDIAI=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=$ALIGN -DCMAKE_SHARED_LINKER_FLAGS=$ALIGN"

          cmake -S llama.cpp -B llama.cpp/build-cpu -G Ninja $COMMON \
            -DGGML_OPENCL=OFF -DGGML_BACKEND_DL=OFF -DGGML_CPU_ALL_VARIANTS=OFF
          cmake --build llama.cpp/build-cpu --target llama-server

          cmake -S llama.cpp -B llama.cpp/build-ocl -G Ninja $COMMON \
            -DGGML_OPENCL=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=OFF \
            -DOpenCL_INCLUDE_DIR=$PWD/opencl-deps/OpenCL-Headers \
            -DOpenCL_LIBRARY=$PWD/opencl-deps/icd-install/lib/libOpenCL.so
          cmake --build llama.cpp/build-ocl --target llama-server

      - name: Stage engines into assets + package artifact
        run: |
          STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          stage() { # $1=build dir $2=dest
            mkdir -p "$2"
            for so in "$1"/bin/*.so; do $STRIP --strip-unneeded "$so"; done
            cp "$1"/bin/* "$2"/
            rm -f "$2"/libggml-cpu-android_armv8.6* "$2"/libggml-cpu-android_armv9*
          }
          stage llama.cpp/build-cpu app/src/main/assets/engines/cpu
          stage llama.cpp/build-ocl app/src/main/assets/engines/opencl

          COMMIT=$(git -C llama.cpp rev-parse --short HEAD)
          mkdir -p engine-out
          (cd app/src/main/assets/engines && zip -r "$GITHUB_WORKSPACE/engine-out/engine-arm64-$COMMIT.zip" cpu opencl)
          SHA=$(sha256sum "engine-out/engine-arm64-$COMMIT.zip" | cut -d' ' -f1)
          cat > engine-out/engine-manifest.json <<EOF
          {
            "version": "$COMMIT",
            "abi": "arm64-v8a",
            "artifact": "engine-arm64-$COMMIT.zip",
            "sha256": "$SHA",
            "min_app_version": "0.3.0",
            "built_at": "$(date -Iseconds)"
          }
          EOF

      - name: Verify engine carries the lazy-expert patch
        run: |
          # 补丁 apply 成功 ≠ 编进产物（上游可能改了实现，getenv 那行被挪走/裁掉）。
          # 这里直接查二进制里的环境变量名，红在 CI 比红在装机后好。
          n=0
          for so in app/src/main/assets/engines/*/libggml-cpu.so; do
            [ -f "$so" ] || continue
            n=$((n + 1))
            # grep -a 直接扫二进制里的字符串（不用 strings：它在某些镜像上不一定有）
            grep -a -q 'LLAMA_LAZY_PREFETCH' "$so" \
              || { echo "::error::$so 里没有 LLAMA_LAZY_PREFETCH，补丁没编进去"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::没找到任何 libggml-cpu.so"; exit 1; }
          echo "ok：$n 个 libggml-cpu.so 都带 LLAMA_LAZY_PREFETCH"

      - name: Build APK (engines already staged in assets)
        run: ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: engine-package
          path: engine-out/
